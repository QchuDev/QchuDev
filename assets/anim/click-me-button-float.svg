<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9 -9 495 262" width="477" height="244" role="img" aria-label="click-me-button">
  <style>
    @keyframes floaty-clickmebutton {
      0%   { transform: translateY(0px)      scale(1); }
      50%  { transform: translateY(-5px) scale(1.05); }
      100% { transform: translateY(0px)      scale(1); }
    }
    .fl-clickmebutton { transform-box: fill-box; transform-origin: 50% 85%;
      animation: floaty-clickmebutton 3.4s ease-in-out 0.0s infinite; will-change: transform; }
  </style>
  <image class="fl-clickmebutton" width="477" height="244" xlink:href="data:image/png;base64," xmlns:xlink="http://www.w3.org/1999/xlink" />
</svg>
